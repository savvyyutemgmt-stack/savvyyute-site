# Savvy Yute Management site editor (Decap CMS)
# Log in at https://savvyyute.netlify.app/admin/
backend:
  name: git-gateway
  branch: main

# Edits are saved as drafts first. Each draft gets its own Netlify preview link.
# Clicking "Publish" in the editor puts the change live on savvyyute.netlify.app.
publish_mode: editorial_workflow

site_url: https://savvyyute.netlify.app
display_url: https://savvyyute.netlify.app
logo_url: /admin/logo.png

media_folder: images/uploads
public_folder: /images/uploads

collections:
  - name: site
    label: Website
    editor:
      preview: false
    files:
      - name: content
        label: Site content
        file: content.json
        format: json
        fields:
          - label: "Design: colours, fonts, logo"
            name: design
            widget: object
            collapsed: true
            fields:
              - { label: "Logo (optional, PNG with transparent background)", name: logo, widget: image, required: false }
              - label: Colours
                name: colors
                widget: object
                fields:
                  - { label: Page background, name: background, widget: color }
                  - { label: Main text, name: text, widget: color }
                  - { label: "Accent (buttons, highlights, route line)", name: accent, widget: color }
                  - { label: Work band gradient start, name: workStart, widget: color }
                  - { label: Work band gradient middle, name: workMiddle, widget: color }
                  - { label: Work band gradient end, name: workEnd, widget: color }
                  - { label: Work band text, name: workText, widget: color }
                  - { label: Contact band background, name: contactBackground, widget: color }
                  - { label: Contact band text, name: contactText, widget: color }
              - label: Text style
                name: fonts
                widget: object
                fields:
                  - { label: Heading font, name: heading, widget: select, options: ["Anton", "Bebas Neue", "Archivo Black", "Oswald", "Space Grotesk", "Syne", "Playfair Display", "DM Serif Display"] }
                  - { label: Body font, name: body, widget: select, options: ["Archivo", "Inter", "DM Sans", "Manrope", "Public Sans", "Work Sans", "Lora", "Source Serif 4"] }
                  - { label: Heading case, name: headingCase, widget: select, options: ["UPPERCASE", "Normal"] }
                  - { label: Heading size, name: headingSize, widget: select, options: ["Small", "Medium", "Large"] }
                  - { label: Body text size, name: bodySize, widget: select, options: ["Small", "Medium", "Large"] }
              - { label: Scrolling section titles, name: scrollingTitles, widget: boolean, default: true }
          - label: "Layout: menu, sections, titles"
            name: layout
            widget: object
            collapsed: true
            fields:
              - label: Menu links
                name: nav
                widget: list
                summary: "{{fields.label}}"
                fields:
                  - { label: Text, name: label, widget: string }
                  - { label: Goes to, name: target, widget: select, options: [{ label: Services, value: services }, { label: Work, value: work }, { label: Hip Hop Cabin, value: hip-hop-cabin }, { label: Contact, value: contact }, { label: Top of page, value: top }] }
              - label: Show or hide sections
                name: sections
                widget: object
                fields:
                  - { label: Release route graphic, name: route, widget: boolean, default: true }
                  - { label: Services, name: services, widget: boolean, default: true }
                  - { label: Work, name: work, widget: boolean, default: true }
                  - { label: Hip Hop Cabin, name: hhc, widget: boolean, default: true }
                  - { label: Partner label line, name: partner, widget: boolean, default: true }
                  - { label: Contact, name: contact, widget: boolean, default: true }
              - label: Section titles
                name: titles
                widget: object
                fields:
                  - { label: Services (scrolling title), name: services, widget: string }
                  - { label: Work (scrolling title), name: work, widget: string }
                  - { label: Hip Hop Cabin heading, name: hhc, widget: string }
                  - { label: Media partners heading, name: partners, widget: string }
                  - { label: Partner label heading, name: partnerLabel, widget: string }
                  - { label: Project artists heading, name: project, widget: string }
                  - { label: Events heading, name: events, widget: string }
              - label: Release route graphic
                name: route
                widget: object
                fields:
                  - { label: Start city, name: start, widget: string }
                  - { label: End city, name: end, widget: string }
                  - label: Steps
                    name: steps
                    widget: list
                    summary: "{{fields.title}}"
                    fields:
                      - { label: Step, name: title, widget: string }
                      - { label: Detail, name: detail, widget: string }
          - label: Search (SEO)
            name: seo
            widget: object
            collapsed: true
            fields:
              - { label: Page title, name: title, widget: string, hint: "Shown in Google and the browser tab. Keep it under 60 characters." }
              - { label: Meta description, name: description, widget: text, hint: "The snippet under your link in search results. Aim for 140 to 160 characters." }
              - { label: Keywords, name: keywords, widget: string, hint: "Comma separated." }
          - label: Hero
            name: hero
            widget: object
            fields:
              - { label: Headline, name: headline, widget: string }
              - { label: Intro, name: intro, widget: text, hint: "The words artists, labels and brands are highlighted in red automatically." }
          - label: Services
            name: services
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: Service, name: title, widget: string }
              - { label: "For (comma separated, e.g. Artists, Labels)", name: who, widget: string }
              - { label: Description, name: text, widget: text }
          - label: Work cards
            name: work
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { label: Name, name: name, widget: string }
              - { label: Label above name, name: kind, widget: string, default: "Management client" }
              - { label: Highlights, name: points, widget: list, field: { label: Highlight, name: point, widget: string } }
              - { label: "Photo (optional, replaces the dark card)", name: image, widget: image, required: false }
          - label: Figures
            name: stats
            widget: list
            summary: "{{fields.value}} {{fields.label}}"
            fields:
              - { label: Figure, name: value, widget: string }
              - { label: Label, name: label, widget: string }
          - label: Project artists
            name: projectArtists
            widget: list
            field: { label: Artist, name: artist, widget: string }
          - label: Events
            name: events
            widget: list
            field: { label: Event, name: event, widget: string }
          - label: Hip Hop Cabin
            name: hhc
            widget: object
            fields:
              - { label: Intro, name: intro, widget: text }
              - label: Media partners
                name: partners
                widget: list
                summary: "{{fields.name}}"
                fields:
                  - { label: Partner, name: name, widget: string }
                  - { label: Year or note, name: when, widget: string }
          - label: Partner label
            name: partner
            widget: object
            fields:
              - { label: Text, name: text, widget: text }
          - label: Contact
            name: contact
            widget: object
            fields:
              - { label: Email, name: email, widget: string }
              - { label: Line above the inquiry sentence, name: note, widget: text }
              - { label: Locations, name: locations, widget: string }
