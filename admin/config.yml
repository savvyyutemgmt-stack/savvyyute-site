# Savvy Yute Management website editor
# Log in at https://savvyyute.netlify.app/admin/
backend:
  name: git-gateway
  branch: staging

# Save creates a draft. Publish moves it to the staging branch (dev): nothing goes live.
# The "Deploy to live site" button in the admin copies staging to main,
# which is the only thing that deploys savvyyute.netlify.app.
publish_mode: editorial_workflow

site_url: https://savvyyute.netlify.app
display_url: https://savvyyute.netlify.app
logo_url: /admin/logo.png

media_folder: images/uploads
public_folder: /images/uploads

collections:
  - name: website
    label: Website
    label_singular: Website
    description: "Everything on the website in one place. Open a section on the left; the live preview on the right jumps to it."
    files:
      - name: site
        label: "Edit website"
        file: content/site.json
        format: json
        fields:
          - label: "Theme settings"
            name: theme
            widget: object
            collapsed: true
            summary: "Colours, fonts and logo for the whole site"
            fields:
              - { label: "Logo", name: logo, widget: image, required: false, hint: "Optional. PNG with a transparent background. Leave empty to keep the current logo." }
              - label: "Colours"
                name: colors
                widget: object
                fields:
                  - { label: "Page background", name: background, widget: color }
                  - { label: "Main text", name: text, widget: color }
                  - { label: "Accent colour", name: accent, widget: color, hint: "Highlighted words, the route line and small details." }
                  - { label: "Portfolio band: gradient left", name: workStart, widget: color }
                  - { label: "Portfolio band: gradient middle", name: workMiddle, widget: color }
                  - { label: "Portfolio band: gradient right", name: workEnd, widget: color }
                  - { label: "Portfolio band: text", name: workText, widget: color }
                  - { label: "Contact band: background", name: contactBackground, widget: color }
                  - { label: "Contact band: text", name: contactText, widget: color }
              - label: "Typography"
                name: fonts
                widget: object
                fields:
                  - { label: "Heading font", name: heading, widget: select, options: ["Anton", "Bebas Neue", "Archivo Black", "Oswald", "Space Grotesk", "Syne", "Playfair Display", "DM Serif Display"], hint: "Anton matches the logo." }
                  - { label: "Body font", name: body, widget: select, options: ["Archivo", "Inter", "DM Sans", "Manrope", "Public Sans", "Work Sans", "Lora", "Source Serif 4"] }
                  - { label: "Heading style", name: headingCase, widget: select, options: ["UPPERCASE", "Normal"] }
                  - { label: "Heading size", name: headingSize, widget: select, options: ["Small", "Medium", "Large"] }
                  - { label: "Body text size", name: bodySize, widget: select, options: ["Small", "Medium", "Large"] }
              - { label: "Scrolling section titles", name: scrollingTitles, widget: boolean, default: true, hint: "Turn off to stop the big section titles sliding across the screen." }

          - label: "Header and menu"
            name: header
            widget: object
            collapsed: true
            summary: "Top menu links"
            fields:
              - label: "Menu links"
                name: nav
                widget: list
                summary: "{{fields.label}}"
                hint: "Drag to reorder."
                fields:
                  - { label: "Link text", name: label, widget: string }
                  - { label: "Scrolls to", name: target, widget: select, options: [{ label: Services, value: services }, { label: Portfolio, value: work }, { label: Ventures, value: ventures }, { label: Contact, value: contact }, { label: Top of page, value: top }] }

          - label: "Hero banner"
            name: hero
            widget: object
            collapsed: true
            summary: "{{fields.headline}}"
            fields:
              - { label: "Background photo", name: image, widget: image, required: false, hint: "Optional. Landscape, at least 1600px wide. Darkened automatically so the text stays readable." }
              - { label: "Headline", name: headline, widget: string }
              - { label: "Intro", name: intro, widget: text, hint: "The words artists, labels and brands turn the accent colour." }
              - { label: "Show the route graphic", name: showRoute, widget: boolean, default: true }
              - label: "Route graphic"
                name: route
                widget: object
                collapsed: true
                fields:
                  - { label: "Start city", name: start, widget: string }
                  - { label: "End city", name: end, widget: string }
                  - label: "Steps"
                    name: steps
                    widget: list
                    summary: "{{fields.title}}"
                    fields:
                      - { label: "Step", name: title, widget: string }
                      - { label: "Detail", name: detail, widget: string }

          - label: "Services"
            name: services
            widget: object
            collapsed: true
            summary: "{{fields.title}}"
            fields:
              - { label: "Show this section", name: show, widget: boolean, default: true }
              - { label: "Section title", name: title, widget: string, hint: "The big scrolling title." }
              - label: "Services"
                name: items
                widget: list
                summary: "{{fields.title}}"
                hint: "Drag to reorder. Numbers are added automatically."
                fields:
                  - { label: "Service name", name: title, widget: string }
                  - { label: "Who it's for", name: who, widget: string, hint: "Separate with commas, e.g. Artists, Labels, Brands." }
                  - { label: "Description", name: text, widget: text }

          - label: "Portfolio"
            name: work
            widget: object
            collapsed: true
            summary: "Clients, figures, project artists and events"
            fields:
              - { label: "Show this section", name: show, widget: boolean, default: true }
              - { label: "Section title", name: title, widget: string, hint: "The big scrolling title, e.g. Work or Our clients." }
              - label: "Client cards"
                name: cards
                widget: list
                summary: "{{fields.name}}"
                fields:
                  - { label: "Name", name: name, widget: string }
                  - { label: "Small label", name: kind, widget: string, default: "Management client" }
                  - { label: "Highlights", name: points, widget: list, field: { label: "Highlight", name: point, widget: string } }
                  - { label: "Photo", name: image, widget: image, required: false, hint: "Optional. Portrait, about 900 x 1200." }
              - label: "Key figures"
                name: stats
                widget: list
                summary: "{{fields.value}} {{fields.label}}"
                fields:
                  - { label: "Figure", name: value, widget: string }
                  - { label: "Label", name: label, widget: string }
              - { label: "Project artists heading", name: projectTitle, widget: string }
              - { label: "Project artists", name: projectArtists, widget: list, field: { label: "Artist", name: artist, widget: string }, hint: "Leave empty to hide." }
              - { label: "Events heading", name: eventsTitle, widget: string }
              - { label: "Events", name: events, widget: list, field: { label: "Event", name: event, widget: string }, hint: "Leave empty to hide." }

          - label: "Ventures"
            name: ventures
            widget: object
            collapsed: true
            summary: "Businesses and platforms under Savvy Yute"
            fields:
              - { label: "Show this section", name: show, widget: boolean, default: true }
              - label: "Ventures"
                name: items
                widget: list
                summary: "{{fields.name}}"
                hint: "One entry per business or platform, e.g. Hip Hop Cabin. Add more as Savvy Yute grows. Drag to reorder."
                fields:
                  - { label: "Name", name: name, widget: string }
                  - { label: "Small label", name: tag, widget: string, required: false, hint: "e.g. Our media arm" }
                  - { label: "Photo", name: image, widget: image, required: false, hint: "Optional. Landscape works best." }
                  - { label: "About", name: about, widget: text }
                  - { label: "Website link", name: link, widget: string, required: false, hint: "Optional. Full address, e.g. https://..." }
                  - { label: "Partners heading", name: partnersTitle, widget: string, default: "Partners" }
                  - label: "Partners"
                    name: partners
                    widget: list
                    summary: "{{fields.name}}"
                    fields:
                      - { label: "Partner or event", name: name, widget: string }
                      - { label: "Year or note", name: when, widget: string }

          - label: "Partners"
            name: partners
            widget: object
            collapsed: true
            summary: "{{fields.title}}"
            fields:
              - { label: "Show this section", name: show, widget: boolean, default: true }
              - { label: "Heading", name: title, widget: string }
              - { label: "Name to highlight", name: highlight, widget: string, required: false, hint: "This name shows in bold inside the text." }
              - { label: "Text", name: text, widget: text }

          - label: "Contact and footer"
            name: contact
            widget: object
            collapsed: true
            summary: "{{fields.email}}"
            fields:
              - { label: "Show the contact section", name: show, widget: boolean, default: true }
              - { label: "Contact email", name: email, widget: string }
              - { label: "Line above the inquiry form", name: note, widget: text }
              - { label: "Locations (footer)", name: locations, widget: string }

          - label: "SEO and sharing"
            name: seo
            widget: object
            collapsed: true
            summary: "Google title, description and share image"
            fields:
              - { label: "Page title", name: title, widget: string, hint: "Under 60 characters." }
              - { label: "Description", name: description, widget: text, hint: "140 to 160 characters." }
              - { label: "Keywords", name: keywords, widget: string, required: false }
              - { label: "Share image", name: shareImage, widget: image, required: false, hint: "Shown when the link is shared. 1200 x 630." }
              - { label: "Browser tab icon", name: favicon, widget: image, required: false, hint: "Square PNG, at least 64 x 64." }
